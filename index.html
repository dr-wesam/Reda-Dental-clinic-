<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reda Dental Clinic</title>
<meta name="description" content="Reda Dental Clinic - New Damietta, Egypt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14313a;
    --muted:#4f6a70;
    --teal:#1f7a7a;
    --teal-dark:#175f5f;
    --mist:#eef5f5;
    --sky:#d9ecec;
    --line:#cfe0e0;
    --white:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--ink);background:var(--white);
    line-height:1.8;font-size:17px;
  }
  a{color:inherit}
  .wrap{width:min(1080px,92%);margin-inline:auto}

  /* Header */
  header{
    position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
  .brand{font-weight:600;font-size:18px;text-decoration:none;color:var(--ink)}
  .bar nav{display:flex;align-items:center;gap:22px}
  .bar nav a{text-decoration:none;color:var(--muted);font-size:15px}
  .bar nav a:hover{color:var(--teal)}
  .lang{
    font:inherit;font-size:14px;cursor:pointer;background:var(--white);color:var(--ink);
    border:1px solid var(--teal);border-radius:999px;padding:5px 16px;
  }
  .lang:hover{background:var(--teal);color:var(--white)}
  :focus-visible{outline:3px solid #f0b429;outline-offset:3px}

  /* Buttons */
  .btn{
    display:inline-block;text-decoration:none;font:inherit;font-weight:500;font-size:16px;
    padding:12px 28px;border-radius:999px;border:1.5px solid var(--teal);cursor:pointer;
    transition:background .2s,color .2s;
  }
  .btn.primary{background:var(--teal);color:var(--white)}
  .btn.primary:hover{background:var(--teal-dark);border-color:var(--teal-dark)}
  .btn.ghost{background:transparent;color:var(--teal)}
  .btn.ghost:hover{background:var(--mist)}

  /* Hero */
  .hero{background:var(--mist);overflow:hidden}
  .hero .wrap{
    display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;
    padding-block:84px;
  }
  .hero h1{font-size:clamp(38px,6vw,68px);line-height:1.2;font-weight:600;letter-spacing:-.01em}
  .hero .name{margin-top:22px;font-size:22px;font-weight:500}
  .hero .role{color:var(--muted);font-size:18px}
  .hero .clinic{color:var(--teal);font-weight:500;margin-top:2px}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
  .hero-art{display:flex;justify-content:center}
  .hero-art svg{width:min(100%,340px);height:auto}

  /* Sections */
  section{padding-block:80px}
  h2{font-size:clamp(28px,4vw,38px);line-height:1.3;font-weight:600;margin-bottom:12px}
  .lead{color:var(--muted);max-width:56ch;margin-bottom:44px}

  /* Services */
  .groups{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .group{padding:6px 32px;border-inline-start:1px solid var(--line)}
  .group:first-child{border-inline-start:none;padding-inline-start:0}
  .group:last-child{padding-inline-end:0}
  .group h3{font-size:21px;font-weight:600;color:var(--teal);margin-bottom:14px}
  .group ul{list-style:none}
  .group li{padding:9px 0;border-bottom:1px solid var(--line)}
  .group li:last-child{border-bottom:none}
  .extra{margin-top:48px;padding:26px 30px;background:var(--mist);border-radius:var(--radius)}
  .extra h3{font-size:19px;font-weight:600;margin-bottom:10px}
  .extra ul{list-style:none;display:flex;flex-wrap:wrap;gap:10px}
  .extra li{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:15px}

  /* Contact */
  #contact{background:var(--mist)}
  .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
  .info dl{display:grid;gap:22px}
  .info dt{font-weight:600;font-size:15px;color:var(--teal)}
  .info dd{font-size:18px}
  .info dd a{text-decoration:none;border-bottom:1px solid var(--teal)}
  .ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 0}
  .ph .num{font-size:19px;font-weight:500}
  .ph .via{font-size:14px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:0 14px;border-bottom:1px solid var(--line)}
  .ph .via:hover{border-color:var(--teal);color:var(--teal)}
  .info dd a.tel{display:block;width:fit-content;border-bottom:none;color:var(--ink)}
  .info dd a.tel:hover{color:var(--teal)}
  .map{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--sky);min-height:340px}
  .map iframe{display:block;width:100%;height:100%;min-height:340px;border:0}
  [hidden]{display:none!important}

  footer{padding:26px 0;text-align:center;color:var(--muted);font-size:14px}

  @media (max-width:820px){
    body{font-size:16px}
    .bar nav a{display:none}
    .hero .wrap{grid-template-columns:1fr;padding-block:56px}
    .hero-art{order:-1}
    .hero-art svg{width:150px}
    section{padding-block:56px}
    .groups{grid-template-columns:1fr}
    .group{padding:22px 0;border-inline-start:none;border-top:1px solid var(--line)}
    .group:first-child{border-top:none;padding-top:0}
    .contact-grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .btn{transition:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top">Reda Dental Clinic</a>
    <nav>
      <a href="#services" data-i18n="nav_services"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language">English</button>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div>
        <h1 data-i18n="hero_title"></h1>
        <p class="name" data-i18n="doctor"></p>
        <p class="role" data-i18n="role"></p>
        <p class="clinic">Reda Dental Clinic</p>
        <div class="actions">
          <a class="btn primary" id="bookBtn" href="#contact" data-i18n="book"></a>
          <a class="btn ghost" id="contactBtn" href="#contact" data-i18n="contact_btn"></a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 320 340" fill="none">
          <circle cx="160" cy="170" r="150" fill="#d9ecec"/>
          <path d="M160 92c-22-20-62-14-72 18-8 26 6 52 12 78 6 28 8 62 22 66 12 3 16-26 22-46 4-12 10-18 16-18s12 6 16 18c6 20 10 49 22 46 14-4 16-38 22-66 6-26 20-52 12-78-10-32-50-38-72-18z" fill="#ffffff" stroke="#1f7a7a" stroke-width="5" stroke-linejoin="round"/>
          <path d="M118 128c8-8 18-10 28-6" stroke="#1f7a7a" stroke-width="4" stroke-linecap="round" opacity=".45"/>
        </svg>
      </div>
    </div>
  </div>

  <section id="services">
    <div class="wrap">
      <h2 data-i18n="services_title"></h2>
      <p class="lead" data-i18n="services_lead"></p>
      <div class="groups" id="groups"></div>
      <div class="extra">
        <h3 data-i18n="extra_title"></h3>
        <ul id="extra"></ul>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2 data-i18n="contact_title"></h2>
      <p class="lead" data-i18n="contact_lead"></p>
      <div class="contact-grid">
        <div class="info">
          <dl>
            <div>
              <dt data-i18n="address_label"></dt>
              <dd data-i18n="address"></dd>
            </div>
            <div id="hoursRow" hidden>
              <dt data-i18n="hours_label"></dt>
              <dd id="hours"></dd>
            </div>
            <div id="phoneRow" hidden>
              <dt data-i18n="phone_label"></dt>
              <dd id="phones"></dd>
            </div>
          </dl>
          <div class="actions">
            <a class="btn primary" id="mapBtn" href="#" target="_blank" rel="noopener" data-i18n="open_map"></a>
          </div>
        </div>
        <div class="map">
          <iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> Reda Dental Clinic</div>
</footer>

<script>
/* ============ إعدادات العيادة: عدّل هنا فقط ============
   PHONES    : أرقام الحجز بالصيغة الدولية بدون + (مصر: 20 ثم الرقم بدون الصفر الأول)
   WHATSAPP  : رقم واتساب زر "احجز موعدك" بنفس الصيغة (الأرقام كلها عليها واتساب)
   HOURS     : مواعيد العمل لكل لغة (اتركها فارغة لإخفاء الخانة)
   MAP_QUERY : نص بحث الخريطة داخل الصفحة
   MAP_LINK  : رابط موقع العيادة على خرائط جوجل (يفتحه الزائر بزر "افتح في خرائط جوجل")
   ====================================================== */
const CONFIG = {
  PHONES: ["201555005838", "201011986104"],
  WHATSAPP: "201555005838",
  HOURS: { ar: "يوميًا من 2 مساءً حتى 10 مساءً", en: "Daily, 2 PM to 10 PM" },
  MAP_QUERY: "شارع النيابة الإدارية، دمياط الجديدة، مصر",
  MAP_LINK: "https://maps.app.goo.gl/UUTWHGkgkUkpCF1R6"
};

/* ============ المحتوى باللغتين ============ */
const T = {
  ar: {
    switch: "English",
    nav_services: "الخدمات",
    nav_contact: "تواصل معنا",
    hero_title: "ابتسامتك تبدأ هنا",
    doctor: "د. محمد رضا البشبيشي",
    role: "علاج وتجميل الأسنان",
    book: "احجز موعدك",
    contact_btn: "تواصل مع العيادة",
    services_title: "خدمات الأسنان",
    services_lead: "علاج وجراحة وتجميل، وخدمات أخرى تحتاجها أسنانك ولثتك.",
    groups: [
      { title: "علاجي", items: ["الحشو", "علاج العصب", "علاج التسوس"] },
      { title: "جراحي", items: ["الخلع", "خلع ضرس العقل", "جراحات الفم"] },
      { title: "تجميلي", items: ["تبييض الأسنان", "الفينير", "تجميل الابتسامة"] }
    ],
    extra_title: "خدمات إضافية",
    extra: ["تنظيف الجير", "علاج اللثة", "التركيبات", "التيجان والجسور", "زراعة الأسنان"],
    contact_title: "معلومات العيادة والتواصل",
    contact_lead: "يمكنك زيارتنا أو التواصل معنا لحجز موعد.",
    address_label: "العنوان",
    address: "دمياط الجديدة - شارع النيابة الإدارية - بجوار ملوكة لملابس الأطفال",
    hours_label: "مواعيد العمل",
    phone_label: "الهاتف",
    wa_short: "واتساب",
    call_short: "اتصال",
    open_map: "افتح في خرائط جوجل"
  },
  en: {
    switch: "العربية",
    nav_services: "Services",
    nav_contact: "Contact",
    hero_title: "Your Smile Starts Here",
    doctor: "Dr. Mohamed Reda El-Beshbishy",
    role: "Dental Care & Aesthetics",
    book: "Book an Appointment",
    contact_btn: "Contact the Clinic",
    services_title: "Dental Services",
    services_lead: "Treatment, surgery and cosmetic care, plus other services for your teeth and gums.",
    groups: [
      { title: "Restorative", items: ["Fillings", "Root canal treatment", "Cavity treatment"] },
      { title: "Surgical", items: ["Tooth extraction", "Wisdom tooth removal", "Oral surgery"] },
      { title: "Cosmetic", items: ["Teeth whitening", "Veneers", "Smile makeover"] }
    ],
    extra_title: "Additional services",
    extra: ["Scaling and cleaning", "Gum treatment", "Prosthetics", "Crowns and bridges", "Dental implants"],
    contact_title: "Clinic information and contact",
    contact_lead: "Visit us or get in touch to book an appointment.",
    address_label: "Address",
    address: "New Damietta - Administrative Prosecution Street - next to Malouka Children’s Clothing",
    hours_label: "Working hours",
    phone_label: "Phone",
    wa_short: "WhatsApp",
    call_short: "Call",
    open_map: "Open in Google Maps"
  }
};

/* ============ منطق الصفحة ============ */
const $ = (id) => document.getElementById(id);
let lang = "ar";
try { lang = localStorage.getItem("lang") || "ar"; } catch (e) {}
if (!T[lang]) lang = "ar";

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = t[el.dataset.i18n];
    if (typeof v === "string") el.textContent = v;
  });

  $("langBtn").textContent = t.switch;
  $("langBtn").setAttribute("aria-label", lang === "ar" ? "Switch to English" : "التبديل إلى العربية");

  $("groups").innerHTML = t.groups.map((g) =>
    `<div class="group"><h3>${g.title}</h3><ul>${g.items.map((i) => `<li>${i}</li>`).join("")}</ul></div>`
  ).join("");
  $("extra").innerHTML = t.extra.map((i) => `<li>${i}</li>`).join("");

  renderPhones();
  const hours = CONFIG.HOURS[lang];
  $("hoursRow").hidden = !hours;
  $("hours").textContent = hours || "";

  document.title = lang === "ar" ? "Reda Dental Clinic | د. محمد رضا البشبيشي" : "Reda Dental Clinic | Dr. Mohamed Reda El-Beshbishy";
}

function intl(n) {
  const d = String(n).replace(/\D/g, "");
  if (d.startsWith("20")) return d;
  return "20" + d.replace(/^0/, "");
}

const clean = (p) => p.replace(/\D/g, "");
const phoneList = () => CONFIG.PHONES.map(clean).filter(Boolean);
const local = (p) => (p.startsWith("20") ? "0" + p.slice(2) : "+" + p);

function renderPhones() {
  const phones = phoneList();
  $("phoneRow").hidden = !phones.length;
  $("phones").innerHTML = phones.map((p) =>
    `<div class="ph"><a class="num" href="tel:+${p}" dir="ltr">${local(p)}</a>` +
    `<a class="via" href="tel:+${p}">${T[lang].call_short}</a>` +
    `<a class="via" href="https://wa.me/${p}" target="_blank" rel="noopener">${T[lang].wa_short}</a></div>`
  ).join("");
}

function setupContact() {
  const phones = phoneList();
  const wa = clean(CONFIG.WHATSAPP || phones[0] || "");
  if (phones.length) $("contactBtn").href = "tel:+" + phones[0];
  if (wa) {
    $("bookBtn").href = "https://wa.me/" + wa;
    $("bookBtn").target = "_blank";
    $("bookBtn").rel = "noopener";
  }
  $("mapFrame").src = "https://www.google.com/maps?q=" + encodeURIComponent(CONFIG.MAP_QUERY) + "&output=embed";
  if (CONFIG.MAP_LINK) $("mapBtn").href = CONFIG.MAP_LINK; else $("mapBtn").hidden = true;
}

$("langBtn").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
});

$("year").textContent = new Date().getFullYear();
setupContact();
render();
</script>
</body>
</html>
